<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment sent</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #18181b; --muted: #71717a; --card: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --fg: #f4f4f5; --muted: #a1a1aa; --card: #18181b; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { margin: 16px; max-width: 360px; padding: 28px 24px; border-radius: 14px; background: var(--card); text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment sent</h1>
      <p>Thank you. Your deposit is being confirmed and will be credited shortly. You can close this page.</p>
    </main>
  </body>
</html>
